<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
            --bg: #030712;
            --accent: #00f5d4;
            --accent2: #f72585;
            --glow: rgba(0, 245,212, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(rgba(0,245,212,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,245,212,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0,245,212,0.07) 0%, transparent 70%);
            pointer-events: none;
        }

        .title {
            font-family:'Courier New', Courier, monospace;
            font-size: clamp(1.5rem, 3vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.5em;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 2rem;
            opacity: 0.7;
        }

        .event-name {
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: clamp(1.8rem, 5vw, 3.5rem);
            font-weight: 900;
            color: #fff;
            text-align: center;
            margin-bottom: 3rem;
            text-shadow: 0 0 40px rgba(0,245,212,0.5);
            letter-spacing: 0.1em;
        }

        .countdown {
            display: flex;
            align-items: center;
            gap: clamp(1rem, 3vw, 2.5rem);
            margin-bottom: 3rem;
        }

        .unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .number {
            font-family:'Courier New', Courier, monospace;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            color: #fff;
            background: linear-gradient(180deg, rgba(0,245,212,0.8) 0%, rgba(0,245,212,0.4) 100%);
            padding: 0.3em 0.5em;
            min-width: 1.8em;
            text-align: center;
            position: relative;
            box-shadow: 0 0 30px rgba(0,245,212,0.1), inset 0 1px 0 rgba(255,255,255,0.05);
            transition: all 0.1s;
        }

        .number::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            top: 50%;
            height: 1px;
            background: rgba(0,245,212,0.15);
        }

        .label {
            font-size: clamp(0.65rem, 1.5vw, 0.85rem);
            letter-spacing: 0.3em;
            color: var(--accent);
            text-transform: uppercase;
            opacity: 0.7;
        }

        .separator {
            font-family:'Courier New', Courier, monospace;
            font-size: clamp(2rem, 5vw, 4rem);
            color: var(--accent);
            opacity: 0.5;
            margin-bottom: 2.5rem;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.1}
        }

        .target-date {
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            color: rgba(0, 245,212, 0.3);
            margin-bottom: 2.5rem;
        }

        .date-picker {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        input[type="datetime-local"] {
            background: rgba(0,245,212,0.05);
            border: 1px solid rgba(0,245,212,0.25);
            border-radius: 8px;
            color: #fff;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1rem;
            padding: 0.6rem 1rem;
            outline: none;
            letter-spacing: 0.05em;
            cursor: pointer;
        }

        input[type="datetime-local"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--glow);
        } 

        input[type="text"] {
            background: rgba(0,245,212,0.05);
            border: 1px solid rgba(0,245,212,0.25);
            border-radius: 8px;
            color: #fff;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1rem;
            padding: 0.6rem 1rem;
            outline: none;
            letter-spacing: 0.05em;
            width: 200px;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--glow);
        }

        button {
            background: var(--accent);
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 8px;
            color: var(--bg);
            font-size: 0.8rem;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            letter-spacing: 0.2em;
            font-weight: 700;
            padding: 0.7rem 1.5rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: #fff;
            box-shadow: 0 0 20px var(--glow);
            transform: translateY(-1px);
        }

        .expired {
            color: var(--accent2);
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .flip {
            animation: flip 0.3s ease;
        }

        @keyframes flip {
            0% { transform: scaleY(0.5); opacity: 0; }
            100% { transform: scaleY(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="title">Time Remaining</div>
    <div class="event-name" id="eventName">NEW YEAR 2027</div>
    <div class="countdown" id="countdown">
        <div class="unit">
            <div class="number" id="days">000</div>
            <div class="label">Days</div>
        </div>
        <div class="separator">:</div>
        <div class="unit">
            <div class="number" id="hours">00</div>
            <div class="label">Hours</div>
        </div>
        <div class="separator">:</div>
        <div class="unit">
            <div class="number" id="minutes">00</div>
            <div class="label">Minutes</div>
        </div>
        <div class="separator">:</div>
        <div class="unit">
            <div class="number" id="seconds">00</div>
            <div class="label">Seconds</div>
        </div>
    </div>
    <div class="target-date" id="targetDisplay"> TARGET: 2027-01-01 * 00:00:00</div>
    <div class="date-picker">
        <input type="text" id="nameInput" placeholder="Event Name" value="NEW YEAR 2027">
        <input type="datetime-local" id="dateInput">
        <button onclick="setTarget()">SET</button>
    </div>
    <script>
        let targetDate = new Date('2027-01-01T00:00:00');
        const dateInput = document.getElementById('dateInput');
        //set default
        const localISO = new Date('2027-01-01T00:00:00').toISOString().slice(0, 16);
        dateInput.value = localISO;

        function setTarget() {
            const val = dateInput.value;
            const name = document.getElementById('nameInput').value || 'COUNTDOWN';
            if(!val) return;
            targetDate = new Date(val);
            document.getElementById('eventName').textContent = name.toUpperCase();
            document.getElementById('targetDisplay').textContent = ` TARGET: ${val.replace('T', ' * ') + ':00'}`;
            alert(`Countdown set for ${name} on ${targetDate.toLocaleString()}`);
        }

        function pad(n, len=2) {
            return String(n).padStart(len, '0');
        }

        function update() {
            const now = new Date();
            const diff = targetDate - now;
            if(diff <= 0) {
                ['days', 'hours', 'minutes', 'seconds'].forEach(id => {
                    const el = document.getElementById(id);
                    el.textContent = pad(0, id === 'days' ? 3 : 2);
                    el.classList.add('expired');
                    alert(`The event "${document.getElementById('eventName').textContent}" has started!`);
                });
                return;
            }
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff % 86400000) / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            const vals = {days: pad(d,3), hours: pad(h), minutes: pad(m), seconds: pad(s)};
            Object.entries(vals).forEach(([id, val]) => {
                const el = document.getElementById(id);
                if(el.textContent !== val) {
                    el.textContent = val;
                    el.classList.remove('flip');
                    void el.offsetWidth;
                    el.classList.add('flip');
                }
            });
        }
        update();
        setInterval(update, 1000);
    </script>
</body>
</html>
